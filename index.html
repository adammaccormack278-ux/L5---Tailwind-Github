<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainbow Six Siege Fan Page</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="bg-slate-900 text-white">
    <header class="bg-red-600 p-5 text-center text-3xl font-bold">
      RAINBOW SIX SIEGE
    </header>

    <main class="mx-auto max-w-4xl p-6">
      <h1 class="text-4xl font-bold text-red-400">Rainbow Six Operator List</h1>

      <p class="mt-4 text-lg text-slate-200">
        Rainbow Six Siege is a tactical shooter. You pick an operator and then
        you try to win the round with good teamwork and smart plans.
      </p>

      <div id="r6-list" class="mt-8 space-y-4"></div>
    </main>

    <footer class="bg-black p-4 text-center text-sm text-gray-300">
      © <span id="year"></span> Rainbow Six Siege Fan Page
    </footer>
  </body>
</html>
